<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 2rem;
    }
    
    .upload-section {
      background: #f8f9fa;
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }
    
    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    button.danger {
      background: #ef4444;
    }
    
    button.danger:hover {
      background: #dc2626;
    }
    
    .result {
      margin-top: 2rem;
      padding: 1rem;
      background: #d1fae5;
      border-left: 4px solid #10b981;
      border-radius: 6px;
    }
    
    .error {
      background: #fee2e2;
      border-left-color: #ef4444;
    }
    
    .file-list {
      margin-top: 2rem;
    }
    
    .file-item {
      background: #f8f9fa;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .file-info {
      flex: 1;
    }
    
    .file-preview {
      max-width: 200px;
      max-height: 150px;
      margin-top: 1rem;
      border-radius: 6px;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    
    .badge.image {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .badge.video {
      background: #fce7f3;
      color: #9f1239;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 File Upload Test</h1>
    
    <div class="upload-section">
      <h2>Upload New File</h2>
      <div class="form-group">
        <label for="fileInput">Select File (Image or Video):</label>
        <input type="file" id="fileInput" accept="image/*,video/*">
      </div>
      
      <div class="form-group">
        <label for="slugInput">Custom Slug (Optional):</label>
        <input type="text" id="slugInput" placeholder="my-custom-slug">
      </div>
      
      <button onclick="uploadFile()">📤 Upload File</button>
    </div>
    
    <div id="result"></div>
    
    <div class="file-list">
      <h2>Uploaded Files</h2>
      <div style="margin-bottom: 1rem;">
        <button onclick="loadFiles()">🔄 Refresh</button>
        <button onclick="loadFiles('image')">🖼️ Images Only</button>
        <button onclick="loadFiles('video')">🎥 Videos Only</button>
      </div>
      <div id="fileList"></div>
    </div>
  </div>
  
  <script>
    const API_URL = 'http://localhost:3000/api';
    
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const slugInput = document.getElementById('slugInput');
      const file = fileInput.files[0];
      
      if (!file) {
        showResult('Please select a file', true);
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      if (slugInput.value) {
        formData.append('slug', slugInput.value);
      }
      
      try {
        const response = await fetch(`${API_URL}/files/upload`, {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          const fileUrl = `http://localhost:3000${data.data.fileUrl}`;
          showResult(`
            <h3>✅ Upload Successful!</h3>
            <p><strong>File:</strong> ${data.data.originalName}</p>
            <p><strong>Type:</strong> ${data.data.fileType}</p>
            <p><strong>Size:</strong> ${formatBytes(data.data.size)}</p>
            <p><strong>URL:</strong> <a href="${fileUrl}" target="_blank">${data.data.fileUrl}</a></p>
            <p><strong>Slug:</strong> ${data.data.slug}</p>
            ${data.data.fileType === 'image' ? 
              `<img src="${fileUrl}" class="file-preview" alt="${data.data.originalName}">` :
              `<video src="${fileUrl}" controls class="file-preview"></video>`
            }
          `);
          
          // Reset form
          fileInput.value = '';
          slugInput.value = '';
          
          // Reload file list
          loadFiles();
        } else {
          showResult('Upload failed: ' + data.message, true);
        }
      } catch (error) {
        showResult('Error: ' + error.message, true);
      }
    }
    
    async function loadFiles(type = null) {
      try {
        const url = type ? `${API_URL}/files?type=${type}` : `${API_URL}/files`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.success) {
          const fileList = document.getElementById('fileList');
          
          if (data.data.length === 0) {
            fileList.innerHTML = '<p style="color: #666;">No files uploaded yet.</p>';
            return;
          }
          
          fileList.innerHTML = '';
          
          data.data.forEach(file => {
            const fileUrl = `http://localhost:3000${file.file_url}`;
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
              <div class="file-info">
                <strong>${file.original_name}</strong>
                <span class="badge ${file.file_type}">${file.file_type}</span>
                <br>
                <small>ID: ${file.id} | Slug: ${file.slug || 'none'} | Size: ${formatBytes(file.size)}</small>
                <br>
                <a href="${fileUrl}" target="_blank">View File</a>
                ${file.file_type === 'image' ? 
                  `<br><img src="${fileUrl}" class="file-preview" alt="${file.original_name}">` :
                  file.file_type === 'video' ?
                  `<br><video src="${fileUrl}" controls class="file-preview"></video>` :
                  ''
                }
              </div>
              <div>
                <button onclick="editFileName(${file.id}, '${file.original_name}', '${file.slug || ''}')">✏️ Edit</button>
                <button class="danger" onclick="deleteFile(${file.id})">🗑️ Delete</button>
              </div>
            `;
            fileList.appendChild(fileItem);
          });
        }
      } catch (error) {
        console.error('Error loading files:', error);
        showResult('Error loading files: ' + error.message, true);
      }
    }
    
    async function editFileName(id, currentName, currentSlug) {
      const newName = prompt('Enter new file name:', currentName);
      if (!newName || newName === currentName) return;
      
      try {
        const response = await fetch(`${API_URL}/files/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            originalName: newName
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showResult('✅ File name updated successfully!');
          loadFiles();
        } else {
          showResult('Update failed: ' + data.message, true);
        }
      } catch (error) {
        showResult('Error: ' + error.message, true);
      }
    }
    
    async function deleteFile(id) {
      if (!confirm('Are you sure you want to delete this file?')) return;
      
      try {
        const response = await fetch(`${API_URL}/files/${id}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
          showResult('✅ File deleted successfully!');
          loadFiles();
        } else {
          showResult('Delete failed: ' + data.message, true);
        }
      } catch (error) {
        showResult('Error: ' + error.message, true);
      }
    }
    
    function showResult(message, isError = false) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = isError ? 'result error' : 'result';
      resultDiv.innerHTML = message;
      resultDiv.style.display = 'block';
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        resultDiv.style.display = 'none';
      }, 5000);
    }
    
    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
    
    // Load files on page load
    loadFiles();
  </script>
</body>
</html>
